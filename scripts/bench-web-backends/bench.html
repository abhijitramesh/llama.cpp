<!doctype html>
<!-- generic runner for emscripten llama.cpp binaries, driven by query params:
       ?bin=llama-bench            which .js to load (default llama-bench)
       &args=-m /m.gguf -p 128     CLI arguments (URL-encoded)
       &model=stories15M.gguf      file to fetch into MEMFS before main()
       &webnn=cpu|gpu|npu          WebNN MLContext deviceType preference
       &f16=1                      force f16 matmul compute in ggml-webnn -->
<html>
<body>
<script>
const q = new URLSearchParams(location.search);
if (q.get('webnn')) {
    globalThis.GGML_WEBNN_DEVICE = q.get('webnn');
}
if (q.get('f16')) {
    globalThis.GGML_WEBNN_FORCE_F16 = true;
}
if (q.get('prune')) {
    globalThis.GGML_WEBNN_PRUNE = true;
}
if (q.get('nosc')) {
    globalThis.GGML_WEBNN_NO_SCATTER = true;
}
if (q.get('chunk')) {
    globalThis.GGML_WEBNN_CHUNK = Number(q.get('chunk'));
}
if (q.get('minb')) {
    globalThis.GGML_WEBNN_MIN_BATCH = Number(q.get('minb'));
}
if (q.get('maxb')) {
    globalThis.GGML_WEBNN_MAX_BATCH = Number(q.get('maxb'));
}
var Module = {
    arguments: (q.get('args') || '').split(' ').filter(function(s) { return s.length > 0; }),
    print: function(t) { console.log(t); },
    printErr: function(t) { console.error(t); },
    onExit: function(code) { console.log('BENCH_EXIT_CODE: ' + code); },
    preRun: [function() {
        const model = q.get('model');
        if (!model) return;
        addRunDependency('fetch-model');
        fetch(model)
            .then(function(r) { if (!r.ok) throw new Error('model fetch failed: ' + r.status); return r.arrayBuffer(); })
            .then(function(buf) {
                FS.writeFile('/' + model, new Uint8Array(buf));
                console.log('BENCH_MODEL_STAGED: ' + buf.byteLength);
                removeRunDependency('fetch-model');
            })
            .catch(function(e) { console.error('BENCH_MODEL_FETCH_FAILED', e); });
    }],
};
const s = document.createElement('script');
s.src = (q.get('bin') || 'llama-bench') + '.js';
document.body.appendChild(s);
</script>
</body>
</html>
